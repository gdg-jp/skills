{{#if imageUrl}}<div style="margin-top:12px;padding:12px;background-color:{{color skin.panelBg}};border:2px solid {{color skin.keyline}};color:{{color skin.text}};">
{{#if heading}}<h2 style="margin:0 0 12px 0;padding:8px 12px;background-color:{{color skin.sticker}};border:2px solid {{color skin.keyline}};font-size:20px;">{{heading}}</h2>{{/if}}
<img src="{{url imageUrl}}" alt="{{alt}}" width="1000" />
{{#if note}}<p style="margin:8px 0 0 0;font-size:13px;">{{note}}</p>{{/if}}
</div>{{/if}}
