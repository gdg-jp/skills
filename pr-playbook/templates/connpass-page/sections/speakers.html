<div style="margin-top:12px;padding:12px;background-color:{{color skin.panelBg}};border:2px solid {{color skin.keyline}};color:{{color skin.text}};">
{{#if heading}}<h2 style="margin:0 0 12px 0;padding:8px 12px;background-color:{{color skin.sticker}};border:2px solid {{color skin.keyline}};font-size:20px;">{{heading}}</h2>{{/if}}
<table border="0" style="border:none;">
<tbody>{{#each speakers}}<tr><td style="padding:8px;border-left:6px solid {{color accent}};">{{#if imageUrl}}<img src="{{url imageUrl}}" alt="{{name}}" width="96" height="96" />{{/if}}</td><td style="padding:8px;"><strong>{{name}}</strong><br><span style="font-size:13px;">{{role}}</span><br>{{sessionTitle}}</td></tr>
{{/each}}</tbody>
</table>
</div>
